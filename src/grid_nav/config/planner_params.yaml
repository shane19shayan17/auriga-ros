planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"   
      tolerance: 0.125
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0     # 0.0 = plain A* ignoring costs
      smoother:
        max_iterations: 1000          # experiment: smoothing may cut corners on a tiny grid

# planner_server creates this costmap node by itself
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 1.0                 # must equal the OccupancyGrid resolution
      robot_radius: 0.1
      track_unknown_space: false
      update_frequency: 1.0
      always_send_full_costmap: true
      plugins: ["static_layer"]       # no inflation: the robot is a point
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

lifecycle_manager_planning:
  ros__parameters:
    autostart: true
    node_names: ["planner_server"]
    bond_timeout: 4.0
